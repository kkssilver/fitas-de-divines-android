name: Gerar APK - Fitas de Divines

on:
  workflow_dispatch:
  push:
    paths:
      - "FitasDeDivines_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Aceitar licenças e verificar SDK
        run: yes | sdkmanager --licenses

      - name: Extrair projeto
        run: |
          unzip FitasDeDivines_Android_Project.zip -d buildsrc
          test -f buildsrc/FitasDeDivines_Android/app/build.gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: |
          cd buildsrc/FitasDeDivines_Android
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FitasDeDivines-APK
          path: buildsrc/FitasDeDivines_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
